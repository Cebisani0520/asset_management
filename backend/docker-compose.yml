#version: '3.8'
services:
  department-service:
    build:
      context: .
      dockerfile: department-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
        DB_HOST: postgres
        DB_PORT: 5432
        DB_NAME: department_db
        DB_USERNAME: admin_user
        DB_PASSWORD: password99
    depends_on:
      - postgres
    networks:
      - postgres

  postgres:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_DB: department_db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password99
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5433:5432"
    networks:
      - postgres
    restart: unless-stopped
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - postgres
    restart: unless-stopped

networks:
  postgres:
    driver: bridge
  spring:
    driver: bridge

volumes:
  postgres:
  pgadmin: