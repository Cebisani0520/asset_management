spring:
  application:
    name: department-service
  datasource:
    username: ${DB_USERNAME:admin_user}
    password: ${DB_PASSWORD:password99}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:department_db}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    hibernate:
        ddl_auto: create
    show-sql: true

